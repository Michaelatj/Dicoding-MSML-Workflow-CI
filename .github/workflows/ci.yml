name: MLflow CI - Re-Training Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'MLProject/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo ──
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Setup Python ──
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      # ── 3. Install dependencies ──
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas==2.2.2 numpy==1.26.4 scikit-learn==1.5.1 matplotlib==3.9.2

      # ── 4. Jalankan MLflow Project ──
      - name: Run MLflow Project
        run: |
          mlflow run MLProject \
            --env-manager=local \
            -P n_estimators=200 \
            -P max_depth=10 \
            -P min_samples_split=2 \
            -P min_samples_leaf=1

      # ── 5. Upload artefak ke GitHub Actions ──
      - name: Upload MLflow Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts-${{ github.run_number }}
          path: |
            mlruns/
            MLProject/confusion_matrix.png
            MLProject/feature_importance.png
            MLProject/classification_report.txt
          retention-days: 30

      # ── 6. Commit mlruns ke repo ──
      - name: Commit MLflow runs to repository
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mlruns/ || true
          git diff --cached --quiet || git commit -m "ci: update mlruns artifacts [run #${{ github.run_number }}]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 7. Setup Docker Buildx ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 8. Login ke Docker Hub ──
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── 9. Build Docker Image via mlflow build-docker ──
      - name: Build Docker Image with MLflow
        run: |
          # Cari run ID terbaru dari mlruns
          EXPERIMENT_ID=$(ls mlruns/ | grep -v '0' | grep -v 'models' | head -1)
          RUN_ID=$(ls mlruns/${EXPERIMENT_ID}/ | grep -v 'meta' | head -1)
          echo "Experiment ID: ${EXPERIMENT_ID}"
          echo "Run ID: ${RUN_ID}"
          echo "Building Docker image from model..."
          mlflow models build-docker \
            -m "mlruns/${EXPERIMENT_ID}/${RUN_ID}/artifacts/model" \
            -n "${{ secrets.DOCKER_USERNAME }}/social-media-mental-health" \
            --enable-mlserver

      # ── 10. Push Docker Image ke Docker Hub ──
      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/social-media-mental-health:latest
          echo "Docker image pushed to: https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/social-media-mental-health"
